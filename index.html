<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life OS</title>
<style>
  :root{
    --paper:#F7F8F6; --card:#FFFFFF; --ink:#1C1F1D; --muted:#7C837C;
    --line:#E2E5E1; --fresh:#3F6B4C; --stale:#9C7A2E; --cold:#9E4F3C;
    --sidebar:#22302A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit;color:inherit;}
  button{cursor:pointer;}
  [hidden]{display:none !important;}

  /* ---------- 布局 ---------- */
  #shell{display:flex;min-height:100vh;}
  nav{width:172px;flex:none;background:var(--sidebar);color:#CFD8D2;padding:22px 0;}
  nav .brand{font-size:15px;font-weight:600;color:#fff;padding:0 18px 18px;}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;
             color:#AFBDB5;padding:8px 18px;font-size:13.5px;}
  nav button:hover{color:#fff;}
  nav button.on{color:#fff;background:rgba(255,255,255,.09);
                box-shadow:inset 2px 0 0 #8FBF9E;}
  nav .badge{float:right;font-size:11px;opacity:.75;}
  nav .sep{height:1px;background:rgba(255,255,255,.1);margin:12px 18px;}
  main{flex:1;padding:34px 34px 90px;max-width:900px;}

  h2{font-size:17px;font-weight:600;margin:0 0 3px;}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:26px 0 10px;}

  /* ---------- 表单 ---------- */
  .form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
        background:var(--card);border:1px solid var(--line);border-radius:9px;
        padding:12px;margin-bottom:18px;}
  .fld{display:flex;flex-direction:column;gap:3px;}
  .fld label{font-size:11px;color:var(--muted);}
  .fld input,.fld select{padding:7px 9px;border:1px solid var(--line);
        border-radius:6px;background:#fff;min-width:120px;}
  .fld.wide{flex:1;min-width:200px;}
  .fld.wide input{width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--fresh);}

  .btn{padding:7px 14px;border:1px solid var(--ink);border-radius:6px;
       background:var(--ink);color:#fff;}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--line);
             padding:3px 9px;font-size:12px;}
  .btn.link{background:none;border:0;color:var(--muted);font-size:12px;padding:3px 6px;}
  .btn.link:hover{color:var(--cold);}

  /* ---------- 列表 ---------- */
  .row{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;
       border-bottom:1px solid var(--line);}
  .row .main{flex:1;min-width:0;}
  .row .title{font-weight:500;}
  .row .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .row .acts{display:flex;gap:5px;align-items:center;flex:none;}
  .done .title{text-decoration:line-through;color:var(--muted);}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;}

  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;
        border:1px solid var(--line);color:var(--muted);}
  .num{font-variant-numeric:tabular-nums;font-weight:600;min-width:58px;}
  .fresh{color:var(--fresh);} .stale{color:var(--stale);} .cold{color:var(--cold);}

  /* ---------- 打卡 ---------- */
  .lines{border-top:1px solid var(--line);}
  .lineBtn{display:flex;align-items:center;gap:15px;width:100%;text-align:left;
           padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;
           cursor:pointer;}
  .cell.canfix{cursor:pointer;}
  .lineBtn:hover{background:rgba(0,0,0,.015);}
  .lineBtn .num{font-size:27px;line-height:1;min-width:66px;}
  .lineBtn .num small{font-size:11px;font-weight:400;color:var(--muted);}
  .mark{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);
        display:grid;place-items:center;color:#fff;font-size:11px;flex:none;}
  .mark.on{background:var(--fresh);border-color:var(--fresh);}
  .cal{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;
       grid-auto-columns:11px;gap:3px;margin-bottom:22px;}
  .cell{width:11px;height:11px;border-radius:2px;background:#E7EAE6;}
  .cell.done{background:var(--fresh);}
  .cell.today{box-shadow:0 0 0 1.5px var(--ink);}
  .cell.future{background:transparent;}

  /* ---------- 首页 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;
        padding:14px 16px;margin-bottom:14px;}
  .card h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .card .row:last-child{border-bottom:0;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1px solid var(--line);border-radius:7px;background:#fff;
        padding:6px 10px;font-size:12.5px;}
  .chip b{font-variant-numeric:tabular-nums;}

  /* ---------- 登录 ---------- */
  #loginView{max-width:300px;margin:90px auto;}
  #loginView input{width:100%;margin-bottom:9px;padding:9px 11px;
        border:1px solid var(--line);border-radius:7px;}
  #loginMsg{font-size:12.5px;color:var(--cold);min-height:19px;margin-top:9px;}

  footer{position:fixed;bottom:0;left:172px;right:0;background:var(--paper);
         border-top:1px solid var(--line);padding:7px 34px;display:flex;
         gap:8px;align-items:center;font-size:12px;}
  #status{margin-left:auto;color:var(--muted);}
  #status.ok{color:var(--fresh);} #status.err{color:var(--cold);}

  @media(max-width:720px){
    #shell{flex-direction:column;}
    nav{width:100%;display:flex;flex-wrap:wrap;padding:10px;}
    nav .brand,nav .sep{display:none;}
    nav button{width:auto;padding:6px 10px;}
    main{padding:20px 16px 90px;}
    footer{left:0;padding:7px 16px;}
  }
</style>
</head>
<body>

<!-- ==================== 登录 ==================== -->
<div id="loginView">
  <h2>Life OS</h2>
  <p class="sub">换设备登一次，数据自己回来</p>
  <input id="email" type="email" placeholder="邮箱" autocomplete="username">
  <input id="password" type="password" placeholder="密码" autocomplete="current-password">
  <button class="btn" id="loginBtn">登录</button>
  <div id="loginMsg"></div>
</div>

<!-- ==================== 主体 ==================== -->
<div id="shell" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>
    <button class="btn quiet" id="syncBtn">同步</button>
    <button class="btn quiet" id="exportBtn">导出 JSON</button>
    <button class="btn quiet" id="logoutBtn">退出</button>
    <span id="status"></span>
  </footer>
</div>

<script type="module">
// ============================================================
// 0. 配置：改这里就等于改功能
// ============================================================

// —— 打卡支线 ——（warn/cold = 变黄、变红的天数；cal=true 额外画日历）
const LINES = [
  { key:"english", name:"English", rule:"任何形式 15 分钟",   warn:3, cold:7  },
  { key:"quant",   name:"Quant",   rule:"任何形式 30 分钟",   warn:7, cold:14 },
  { key:"reading", name:"Reading", rule:"读了任意页数",       warn:4, cold:10 },
  { key:"psoas",   name:"髂腰肌",   rule:"康复动作满 10 分钟", warn:2, cold:4, cal:true },
  { key:"plantar", name:"足底",     rule:"康复动作满 10 分钟", warn:2, cold:4, cal:true },
];

// —— 各表的字段定义 ——
// 加字段 = 在 fields 里加一项，表单和存储自动跟上。
const SCHEMA = {
  task: {
    nav:"任务", title:"任务", sub:"有截止日、做完就消失的事",
    fields:[
      {k:"title", label:"要做什么", type:"text", wide:true},
      {k:"tag",   label:"分类", type:"select", options:["课程","申请","杂事"]},
      {k:"due",   label:"截止日", type:"date"},
    ]},
  expiry: {
    nav:"到期", title:"到期与流程", sub:"低频但错过就是硬后果的东西",
    fields:[
      {k:"title",  label:"事项", type:"text", wide:true},
      {k:"due",    label:"到期日（有固定日期填这个）", type:"date"},
      {k:"lastc",  label:"上次往来（等回复的填这个）", type:"date"},
      {k:"remind", label:"窗口（天）", type:"number", def:30},
      {k:"ball",   label:"球在谁手上", type:"select", options:["我","对方","无"]},
    ]},
  xhs: {
    nav:"小红书", title:"选题库", sub:"想法 → 在写 → 已发 → 数据",
    fields:[
      {k:"title",  label:"选题", type:"text", wide:true},
      {k:"status", label:"状态", type:"select", options:["想法","在写","已发","数据"]},
      {k:"link",   label:"链接", type:"text"},
    ]},
  trade: {
    nav:"投资", title:"投资决策日志", sub:"不记市值，只记判断——回头才能对账",
    fields:[
      {k:"ticker",  label:"标的", type:"text"},
      {k:"action",  label:"动作", type:"select", options:["买入","加仓","减仓","观望·没买"]},
      {k:"thesis",  label:"当时的判断", type:"text", wide:true},
      {k:"macro",   label:"依赖哪个宏观变量", type:"text"},
      {k:"invalid", label:"什么信号说明我错了", type:"text", wide:true},
      {k:"date",    label:"日期", type:"date"},
    ]},
  event: {
    nav:"活动", title:"Networking events", sub:"衡量的是有没有在持续认识新的人",
    fields:[
      {k:"title",    label:"活动", type:"text", wide:true},
      {k:"date",     label:"日期", type:"date"},
      {k:"status",   label:"状态", type:"select", options:["想去","已报名","已参加","没去"]},
      {k:"met",      label:"认识了谁", type:"text"},
      {k:"takeaway", label:"一句收获", type:"text", wide:true},
    ]},
  person: {
    nav:"人脉", title:"人脉", sub:"红黄绿标在每个人身上，不是标在整条支线上",
    fields:[
      {k:"name",    label:"姓名", type:"text"},
      {k:"org",     label:"公司 / 关系", type:"text"},
      {k:"channel", label:"怎么认识的", type:"text"},
      {k:"last",    label:"上次联系", type:"date"},
      {k:"cycle",   label:"多久该联系一次（天）", type:"number", def:60},
      {k:"note",    label:"备注", type:"text", wide:true},
    ]},
  review: {
    nav:"底仓", title:"长期底仓", sub:"几周不碰正常，半年不碰就废了",
    fields:[
      {k:"title", label:"条目", type:"text", wide:true},
      {k:"cycle", label:"多久 review 一次（天）", type:"number", def:30},
      {k:"last",  label:"上次 review", type:"date"},
    ]},
};

// ============================================================
// 1. Firebase
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBH_UM4RhDORq1rCdE7FurcRejAgLRQ_Ds",
  authDomain: "i-want-to-be-5db0e.firebaseapp.com",
  projectId: "i-want-to-be-5db0e",
  storageBucket: "i-want-to-be-5db0e.firebasestorage.app",
  messagingSenderId: "965573738658",
  appId: "1:965573738658:web:f4da2d4e424166e21f17fb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let uid = null, items = [], view = "home", editing = null;
const LS_KEY = "lifeos_items";

// ============================================================
// 2. 存储层（V0 验证过，原样保留）
// ============================================================
const loadLocal = () => { try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch{ return []; } };
const saveLocal = a => localStorage.setItem(LS_KEY, JSON.stringify(a));

function merge(l, c){
  const m = new Map(l.map(i=>[i.id,i]));
  for(const x of c){ const o=m.get(x.id); if(!o || (x.updatedAt||0)>(o.updatedAt||0)) m.set(x.id,x); }
  return [...m.values()];
}

let syncing=false, syncQueued=false;
async function sync(){
  if(!uid) return;
  if(syncing){ syncQueued=true; return; }        // 已有一个在跑：记一笔，跑完补一次
  syncing=true;
  setStatus("同步中…");
  try{
    const snap = await getDocs(collection(db,"users",uid,"items"));
    const cloud = snap.docs.map(d=>d.data());
    const cm = new Map(cloud.map(c=>[c.id,c]));
    const toPush = items.filter(l=>{ const c=cm.get(l.id); return !c || (l.updatedAt||0)>(c.updatedAt||0); });
    items = merge(items, cloud);
    saveLocal(items); render();
    for(const it of toPush){                     // 串行写，不并发
      await setDoc(doc(db,"users",uid,"items",it.id), it);
    }
    setStatus("已同步","ok");
  }catch(e){ setStatus("同步失败："+(e.code||e.message),"err"); console.error(e); }
  finally{
    syncing=false;
    if(syncQueued){ syncQueued=false; sync(); }   // 同步期间又有写入 → 再跑一轮兜底
  }
}

function put(o){
  const now = Date.now();
  const i = items.findIndex(x=>x.id===o.id);
  if(i>=0) items[i] = {...items[i], ...o, updatedAt:now};
  else     items.push({createdAt:now, deleted:false, ...o, updatedAt:now});
  saveLocal(items); render(); sync();
}
const del = id => put({id, deleted:true});          // 软删除，否则同步会把它复活

// ============================================================
// 3. 日期
//    本地日期字符串当 key，不用 UTC——Perth 晚上打的卡不会跳到明天
// ============================================================
function dayKey(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const toDate = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const diffDays = (a,b) => Math.round((b-a)/86400000);
const daysUntil = k => k ? diffDays(toDate(dayKey()), toDate(k)) : null;   // 正=还剩几天
const daysSince = k => k ? diffDays(toDate(k), toDate(dayKey())) : null;   // 正=过了几天

// ============================================================
// 4. 取数
// ============================================================
const all = t => items.filter(i=>i.type===t && !i.deleted);

const openTasks    = () => all("task").filter(t=>!t.done)
                             .sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
const dueSoon      = (n=7) => openTasks().filter(t=>t.due && daysUntil(t.due)<=n);
const expiryAlerts = () => all("expiry").filter(e=>{
                             const w = +e.remind||30;
                             if(e.due)   return daysUntil(e.due) <= w;   // 固定到期日：进入提醒窗口
                             if(e.lastc) return daysSince(e.lastc) >= w; // 流程件：沉默超过窗口，该催了
                             return false;
                           }).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
// 未来 7 天内「想去 / 已报名」的活动 → 上首页
const upcomingEvts = () => all("event")
                             .filter(e=>e.date && ["想去","已报名"].includes(e.status)
                                     && daysUntil(e.date)>=0 && daysUntil(e.date)<=7)
                             .sort((a,b)=>a.date.localeCompare(b.date));
const inboxOpen    = () => all("note").filter(n=>!n.digested).sort((a,b)=>b.createdAt-a.createdAt);
const peopleDue    = () => all("person")
                             .filter(p=>!p.last || daysSince(p.last) >= (+p.cycle||60));
const reviewDue    = () => all("review")
                             .filter(r=>!r.last || daysSince(r.last) >= (+r.cycle||30));

const lineDays = k => all("checkin").filter(c=>c.line===k).map(c=>c.day);
function lineIdle(k){ const d=lineDays(k); return d.length ? daysSince(d.sort().at(-1)) : null; }
function tone(n, warn, cold){
  if(n===null || n>=cold) return "cold";
  if(n>=warn) return "stale";
  return "fresh";
}

// ============================================================
// 5. 通用渲染件
// ============================================================
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setStatus = (m,c="") => { $("status").textContent=m; $("status").className=c; };

// 根据 SCHEMA 自动生成新增/编辑表单
function formHTML(type){
  const s = SCHEMA[type];
  const e = editing && editing.type===type ? editing : null;
  const fields = s.fields.map(f=>{
    const v = e ? (e[f.k] ?? "") : (f.def ?? (f.type==="date" && (f.k==="date"||f.k==="last") ? dayKey() : ""));
    const inp = f.type==="select"
      ? `<select data-f="${f.k}">${f.options.map(o=>
          `<option ${String(v)===o?"selected":""}>${o}</option>`).join("")}</select>`
      : `<input data-f="${f.k}" type="${f.type}" value="${esc(v)}">`;
    return `<div class="fld ${f.wide?"wide":""}"><label>${f.label}</label>${inp}</div>`;
  }).join("");
  return `<div class="form" id="form">
            ${fields}
            <button class="btn" id="saveBtn">${e?"更新":"添加"}</button>
            ${e?`<button class="btn quiet" id="cancelBtn">取消</button>`:""}
          </div>`;
}

function bindForm(type){
  $("saveBtn").onclick = () => {
    const o = {};
    document.querySelectorAll("#form [data-f]").forEach(el=> o[el.dataset.f]=el.value.trim?el.value.trim():el.value);
    const first = SCHEMA[type].fields[0].k;
    if(!o[first]) return;                                   // 第一个字段是必填
    put(editing ? {...o, id:editing.id} : {...o, id:crypto.randomUUID(), type});
    editing = null;
  };
  if($("cancelBtn")) $("cancelBtn").onclick = () => { editing=null; render(); };
}

const editBtn = id => `<button class="btn link" data-edit="${id}">编辑</button>`;
const delBtn  = id => `<button class="btn link" data-del="${id}">删除</button>`;

function bindRows(){
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>del(b.dataset.del));
  document.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>{
    editing = items.find(i=>i.id===b.dataset.edit); render();
  });
}

function list(arr, rowFn, emptyMsg){
  return arr.length ? arr.map(rowFn).join("") : `<p class="empty">${emptyMsg}</p>`;
}

// ============================================================
// 6. 各视图
// ============================================================
function viewHome(){
  const tasks = dueSoon(7), exp = expiryAlerts(), inbox = inboxOpen();
  const ppl = peopleDue(), rev = reviewDue();

  const taskRows = list(tasks, t=>{
    const d = daysUntil(t.due);
    const label = d<0 ? `逾期 ${-d} 天` : d===0 ? "今天" : `${d} 天后`;
    return `<div class="row">
      <span class="num ${d<=1?"cold":d<=3?"stale":"fresh"}">${label}</span>
      <div class="main"><div class="title">${esc(t.title)}</div>
        <div class="meta"><span class="pill">${esc(t.tag||"")}</span></div></div>
      <div class="acts"><button class="btn quiet" data-done="${t.id}">完成</button></div>
    </div>`;
  }, "七天内没有到期的任务。");

  const expRows = list(exp, e=>{
    const ball = e.ball&&e.ball!=="无" ? ` · 球在${esc(e.ball)}` : "";
    if(e.due){
      const d = daysUntil(e.due);
      return `<div class="row">
        <span class="num ${d<=7?"cold":"stale"}">${d<0?`逾期 ${-d}`:`${d} 天`}</span>
        <div class="main"><div class="title">${esc(e.title)}</div>
          <div class="meta">${esc(e.due)}${ball}</div></div>
      </div>`;
    }
    const n = daysSince(e.lastc), w = +e.remind||30;   // 流程件：显示沉默天数
    return `<div class="row">
      <span class="num ${n>=w*2?"cold":"stale"}">沉默 ${n} 天</span>
      <div class="main"><div class="title">${esc(e.title)}</div>
        <div class="meta">上次往来 ${esc(e.lastc)}${ball}</div></div>
    </div>`;
  }, "没有临近的到期事项。");

  const evts = upcomingEvts();
  const evtRows = evts.map(e=>{
    const d = daysUntil(e.date);
    return `<div class="row">
      <span class="num ${d<=1?"stale":"fresh"}">${d===0?"今天":d===1?"明天":d+" 天后"}</span>
      <div class="main"><div class="title">${esc(e.title)}</div>
        <div class="meta"><span class="pill">${esc(e.status)}</span> ${esc(e.date)}</div></div>
    </div>`;
  }).join("");

  const lineChips = LINES.map(c=>{
    const n = lineIdle(c.key);
    return `<span class="chip"><b class="${tone(n,c.warn,c.cold)}">${
      n===null?"从没":n===0?"今天":n+"天"}</b> ${c.name}</span>`;
  }).join("");

  // D 类支线：最近一次「动过」距今几天（阈值来自 spec 红黄绿表）
  const lastDayOf = days => days.length ? daysSince(days.sort().at(-1)) : null;
  const xhsIdle   = lastDayOf(all("xhs").map(x=>dayKey(new Date(x.updatedAt||x.createdAt))));
  const tradeIdle = lastDayOf(all("trade").map(t=>t.date).filter(Boolean));
  const evtIdle   = lastDayOf(all("event").filter(e=>e.status==="已参加"&&e.date).map(e=>e.date));
  const dChips = [["小红书",xhsIdle,7,14],["投资",tradeIdle,30,45],["Events",evtIdle,21,45]]
    .map(([name,n,w,c])=>`<span class="chip"><b class="${tone(n,w,c)}">${
      n===null?"从没":n===0?"今天":n+"天"}</b> ${name}</span>`).join("");

  return `
    <h2>今天</h2>
    <p class="sub">${new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"long"})}</p>

    <div class="card"><h4>七天内到期</h4>${taskRows}</div>
    <div class="card"><h4>到期与流程</h4>${expRows}</div>
    ${evts.length?`<div class="card"><h4>接下来的活动</h4>${evtRows}</div>`:""}

    <h3>支线状态</h3>
    <div class="chips" style="margin-bottom:16px">${lineChips}${dChips}</div>

    <h3>该处理的</h3>
    <div class="chips">
      <span class="chip">Inbox 未消化 <b>${inbox.length}</b></span>
      <span class="chip">该联系的人 <b class="${ppl.length?"stale":""}">${ppl.length}</b></span>
      <span class="chip">该 review 的底仓 <b class="${rev.length?"stale":""}">${rev.length}</b></span>
    </div>`;
}

function viewCheckin(){
  const today = dayKey();
  const yd = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); })();
  const rows = LINES.map(c=>{
    const days = lineDays(c.key);
    const n = lineIdle(c.key), done = days.includes(today);
    const num = n===null ? "从没" : n===0 ? "今天" : n;
    const unit = (n===null||n===0) ? "" : `<small>天前</small>`;
    return `<div class="lineBtn" data-line="${c.key}">
      <span class="num ${tone(n,c.warn,c.cold)}">${num}${unit}</span>
      <span class="main"><span class="title">${c.name}</span>
        <div class="meta">${c.rule}</div></span>
      ${days.includes(yd)?"":`<button class="btn link" data-fill="${c.key}">补昨天</button>`}
      <span class="mark ${done?"on":""}">${done?"✓":""}</span></div>`;
  }).join("");

  const today0 = toDate(dayKey());
  const start = new Date(today0);
  start.setDate(start.getDate()-69);
  start.setDate(start.getDate()-((start.getDay()+6)%7));      // 回退到那周周一

  const cals = LINES.filter(c=>c.cal).map(c=>{
    const done = new Set(lineDays(c.key));
    let cells="", hit=0;
    for(let i=0;i<77;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=dayKey(d);
      let cls = d>today0 ? "future" : (done.has(k) ? (hit++, "done") : "");
      const back = diffDays(d, today0);                 // 近 7 天可点击补卡/取消
      const fix = back>=0 && back<=7 ? ` canfix" data-cal="${c.key}" data-day="${k}` : "";
      cells += `<div class="cell ${cls}${k===dayKey()?" today":""}${fix}" title="${k}"></div>`;
    }
    return `<h3>${c.name} · 近 10 周做了 ${hit} 天</h3><div class="cal">${cells}</div>`;
  }).join("");

  return `<h2>打卡</h2><p class="sub">点整行 = 今天碰过了，再点取消 · 漏打的用行尾「补昨天」，康复日历近 7 天格子也能直接点</p>
          <div class="lines">${rows}</div>${cals}`;
}

function viewTasks(){
  const open = openTasks(), done = all("task").filter(t=>t.done).slice(-15).reverse();
  const row = t=>{
    const d = daysUntil(t.due);
    return `<div class="row ${t.done?"done":""}">
      <span class="num ${d===null?"":d<0?"cold":d<=3?"stale":"fresh"}">${
        t.due ? (d<0?`逾期${-d}`:d===0?"今天":`${d}天`) : "—"}</span>
      <div class="main"><div class="title">${esc(t.title)}</div>
        <div class="meta"><span class="pill">${esc(t.tag||"")}</span> ${esc(t.due||"")}</div></div>
      <div class="acts">
        <button class="btn quiet" data-done="${t.id}">${t.done?"撤销":"完成"}</button>
        ${editBtn(t.id)}${delBtn(t.id)}</div></div>`;
  };
  return `<h2>${SCHEMA.task.title}</h2><p class="sub">${SCHEMA.task.sub}</p>
    ${formHTML("task")}
    ${list(open,row,"没有待办。")}
    ${done.length?`<h3>最近完成</h3>${done.map(row).join("")}`:""}`;
}

function viewExpiry(){
  const arr = all("expiry").sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const row = e=>{
    const w = +e.remind||30;
    const ball = e.ball&&e.ball!=="无" ? ` · 球在${esc(e.ball)}` : "";
    let num, t, meta;
    if(e.due){                                   // 固定到期日模式
      const d = daysUntil(e.due);
      t = d<0 ? "cold" : d<=w ? "stale" : "fresh";
      num = d<0 ? `逾期${-d}` : `${d}天`;
      meta = `${esc(e.due)} · 提前 ${w} 天提醒${ball}`;
    }else if(e.lastc){                           // 流程件模式：看沉默天数
      const n = daysSince(e.lastc);
      t = n>=w*2 ? "cold" : n>=w ? "stale" : "fresh";
      num = `沉默${n}天`;
      meta = `上次往来 ${esc(e.lastc)} · 超 ${w} 天该催${ball}`;
    }else{
      t=""; num="—"; meta=`两个日期都没填，不会提醒${ball}`;
    }
    return `<div class="row">
      <span class="num ${t}">${num}</span>
      <div class="main"><div class="title">${esc(e.title)}</div>
        <div class="meta">${meta}</div></div>
      <div class="acts">${editBtn(e.id)}${delBtn(e.id)}</div></div>`;
  };
  return `<h2>${SCHEMA.expiry.title}</h2><p class="sub">${SCHEMA.expiry.sub}</p>
    ${formHTML("expiry")}${list(arr,row,"还没有登记到期事项。签证、OSHC、护照、选课窗口都该在这。")}`;
}

function viewXhs(){
  const order = ["数据","已发","在写","想法"];
  const arr = all("xhs").sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status) || b.createdAt-a.createdAt);
  const row = x=>`<div class="row">
      <span class="pill">${esc(x.status||"想法")}</span>
      <div class="main"><div class="title">${esc(x.title)}</div>
        ${x.link?`<div class="meta"><a href="${esc(x.link)}" target="_blank" rel="noopener">链接</a></div>`:""}</div>
      <div class="acts">${editBtn(x.id)}${delBtn(x.id)}</div></div>`;
  return `<h2>${SCHEMA.xhs.title}</h2><p class="sub">${SCHEMA.xhs.sub}</p>
    ${formHTML("xhs")}${list(arr,row,"空的。刷到能写的角度就先扔一条。")}`;
}

function viewTrade(){
  const arr = all("trade").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const row = t=>`<div class="row">
      <span class="pill">${esc(t.action||"")}</span>
      <div class="main">
        <div class="title">${esc(t.ticker)} <span class="meta">${esc(t.date||"")}</span></div>
        <div class="meta">${esc(t.thesis||"")}</div>
        ${t.macro?`<div class="meta">宏观变量：${esc(t.macro)}</div>`:""}
        ${t.invalid?`<div class="meta">证伪信号：${esc(t.invalid)}</div>`:""}
      </div>
      <div class="acts">${editBtn(t.id)}${delBtn(t.id)}</div></div>`;
  return `<h2>${SCHEMA.trade.title}</h2><p class="sub">${SCHEMA.trade.sub}</p>
    ${formHTML("trade")}${list(arr,row,"「观望·没买」也要记——那是最干净的对照组。")}`;
}

function viewEvent(){
  const arr = all("event").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const gone = arr.filter(e=>e.status==="已参加");
  const idle = gone.length ? daysSince(gone[0].date) : null;
  const row = e=>`<div class="row">
      <span class="pill">${esc(e.status||"")}</span>
      <div class="main"><div class="title">${esc(e.title)} <span class="meta">${esc(e.date||"")}</span></div>
        ${e.met?`<div class="meta">认识了：${esc(e.met)}</div>`:""}
        ${e.takeaway?`<div class="meta">${esc(e.takeaway)}</div>`:""}</div>
      <div class="acts">${editBtn(e.id)}${delBtn(e.id)}</div></div>`;
  return `<h2>${SCHEMA.event.title}</h2><p class="sub">${SCHEMA.event.sub}</p>
    <div class="chips" style="margin-bottom:16px">
      <span class="chip">上次参加 <b class="${tone(idle,21,45)}">${idle===null?"从没":idle+" 天前"}</b></span>
      <span class="chip">累计参加 <b>${gone.length}</b></span></div>
    ${formHTML("event")}${list(arr,row,"「没去」的也记——报了名没去的比去了的更说明问题。")}`;
}

function viewPerson(){
  const arr = all("person").sort((a,b)=>(a.last||"0").localeCompare(b.last||"0"));
  const row = p=>{
    const n = daysSince(p.last), cyc = +p.cycle||60;
    return `<div class="row">
      <span class="num ${tone(n,cyc*0.7,cyc)}">${n===null?"从没":n===0?"今天":n+"天"}</span>
      <div class="main"><div class="title">${esc(p.name)} <span class="meta">${esc(p.org||"")}</span></div>
        <div class="meta">${esc(p.channel||"")}${p.note?" · "+esc(p.note):""} · 每 ${cyc} 天</div></div>
      <div class="acts">
        <button class="btn quiet" data-touch="${p.id}">今天联系了</button>
        ${editBtn(p.id)}${delBtn(p.id)}</div></div>`;
  };
  return `<h2>${SCHEMA.person.title}</h2><p class="sub">${SCHEMA.person.sub}</p>
    ${formHTML("person")}${list(arr,row,"从 events 里认识的人填到这来。")}`;
}

function viewReview(){
  const arr = all("review").sort((a,b)=>(a.last||"0").localeCompare(b.last||"0"));
  const row = r=>{
    const n = daysSince(r.last), cyc = +r.cycle||30;
    return `<div class="row">
      <span class="num ${tone(n,cyc*0.7,cyc)}">${n===null?"从没":n===0?"今天":n+"天"}</span>
      <div class="main"><div class="title">${esc(r.title)}</div>
        <div class="meta">每 ${cyc} 天该看一次</div></div>
      <div class="acts">
        <button class="btn quiet" data-touch="${r.id}">已 review</button>
        ${editBtn(r.id)}${delBtn(r.id)}</div></div>`;
  };
  return `<h2>${SCHEMA.review.title}</h2><p class="sub">${SCHEMA.review.sub}</p>
    ${formHTML("review")}${list(arr,row,"Career 方向、作品集、app roadmap 都该在这。")}`;
}

function viewInbox(){
  const arr = inboxOpen();
  const doneN = all("note").filter(n=>n.digested).length;
  return `<h2>Inbox</h2><p class="sub">不分类不打标签，周末再分流</p>
    <div class="form">
      <div class="fld wide"><label>扔进来</label><input id="noteText" type="text"
        placeholder="播客里的一个点、一个选题、一本想看的书…"></div>
      <button class="btn" id="noteAdd">存</button>
    </div>
    ${list(arr, n=>`<div class="row">
        <div class="main"><div class="title">${esc(n.text)}</div>
          <div class="meta">${new Date(n.createdAt).toLocaleDateString("zh-CN")}</div></div>
        <div class="acts"><button class="btn quiet" data-digest="${n.id}">消化</button>
          ${delBtn(n.id)}</div></div>`, "空的。刷到什么就扔进来。")}
    ${doneN?`<h3>已消化 ${doneN} 条</h3>`:""}`;
}

// ============================================================
// 7. 路由与绑定
// ============================================================
const NAV = [
  ["home","今天"], ["task",SCHEMA.task.nav], ["expiry",SCHEMA.expiry.nav],
  ["checkin","打卡"], ["-"], ["xhs",SCHEMA.xhs.nav], ["trade",SCHEMA.trade.nav],
  ["event",SCHEMA.event.nav], ["person",SCHEMA.person.nav], ["-"],
  ["inbox","Inbox"], ["review",SCHEMA.review.nav],
];

function renderNav(){
  const badges = {
    home: dueSoon(7).length + expiryAlerts().length,
    task: openTasks().length,
    inbox: inboxOpen().length,
    person: peopleDue().length,
    review: reviewDue().length,
  };
  $("nav").innerHTML = `<div class="brand">Life OS</div>` + NAV.map(([k,label])=>
    k==="-" ? `<div class="sep"></div>`
    : `<button data-v="${k}" class="${view===k?"on":""}">${label}
         ${badges[k] ? `<span class="badge">${badges[k]}</span>` : ""}</button>`).join("");
  $("nav").querySelectorAll("[data-v]").forEach(b=>
    b.onclick = () => { view=b.dataset.v; editing=null; render(); });
}

const VIEWS = { home:viewHome, task:viewTasks, expiry:viewExpiry, checkin:viewCheckin,
                xhs:viewXhs, trade:viewTrade, event:viewEvent, person:viewPerson,
                inbox:viewInbox, review:viewReview };

function render(){
  if(!uid) return;
  renderNav();
  $("main").innerHTML = VIEWS[view]();

  if(SCHEMA[view]) bindForm(view);
  bindRows();

  // 打卡：点整行切换今天
  document.querySelectorAll("[data-line]").forEach(b=> b.onclick=()=>{
    const day=dayKey(), id=`checkin_${b.dataset.line}_${day}`;
    const cur=items.find(i=>i.id===id);
    // id 固定 → 同一天重复点不会多出一条，多设备也落在同一个 id
    put({id, type:"checkin", line:b.dataset.line, day, deleted: cur ? !cur.deleted : false});
  });
  // 补昨天（stopPropagation：这个按钮在整行点击区里面，不拦会连带打今天的卡）
  document.querySelectorAll("[data-fill]").forEach(b=> b.onclick=e=>{
    e.stopPropagation();
    const d=new Date(); d.setDate(d.getDate()-1); const day=dayKey(d);
    put({id:`checkin_${b.dataset.fill}_${day}`, type:"checkin", line:b.dataset.fill, day, deleted:false});
  });
  // 日历格子补卡 / 取消（近 7 天）
  document.querySelectorAll("[data-cal]").forEach(el=> el.onclick=()=>{
    const line=el.dataset.cal, day=el.dataset.day, id=`checkin_${line}_${day}`;
    const cur=items.find(i=>i.id===id);
    put({id, type:"checkin", line, day, deleted: cur ? !cur.deleted : false});
  });
  // 任务完成 / 撤销
  document.querySelectorAll("[data-done]").forEach(b=> b.onclick=()=>{
    const t=items.find(i=>i.id===b.dataset.done); put({id:t.id, done:!t.done});
  });
  // 「今天联系了」/「已 review」
  document.querySelectorAll("[data-touch]").forEach(b=> b.onclick=()=>
    put({id:b.dataset.touch, last:dayKey()}));
  // Inbox 消化
  document.querySelectorAll("[data-digest]").forEach(b=> b.onclick=()=>
    put({id:b.dataset.digest, digested:true}));

  if($("noteAdd")){
    const add = () => {
      const t=$("noteText").value.trim(); if(!t) return;
      put({id:crypto.randomUUID(), type:"note", text:t, digested:false});
    };
    $("noteAdd").onclick = add;
    $("noteText").onkeydown = e => { if(e.key==="Enter") add(); };
  }
}

// ============================================================
// 8. 登录与启动
// ============================================================
$("loginBtn").onclick = async () => {
  $("loginMsg").textContent="登录中…";
  try{ await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch(e){ $("loginMsg").textContent="登录失败："+e.code; }
};
$("logoutBtn").onclick = () => signOut(auth);
$("syncBtn").onclick = sync;
$("exportBtn").onclick = () => {
  const b = new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `lifeos-${dayKey()}.json`;
  a.click();
};

onAuthStateChanged(auth, async user => {
  if(user){
    uid = user.uid;
    $("loginView").hidden = true; $("shell").hidden = false;
    items = loadLocal(); render();     // 本地先渲染，秒开
    await sync();                      // 云端到了再刷
  }else{
    uid=null; items=[];
    $("loginView").hidden=false; $("shell").hidden=true;
    $("loginMsg").textContent="";
  }
});
</script>
