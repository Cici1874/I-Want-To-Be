<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life OS</title>
<style>
  :root{
    --paper:#F7F8F6; --card:#FFFFFF; --ink:#1C1F1D; --muted:#7C837C;
    --line:#E2E5E1; --fresh:#3F6B4C; --stale:#9C7A2E; --cold:#9E4F3C;
    --appt:#46648C; --purp:#6F5B93;
    --sidebar:#22302A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit;color:inherit;}
  button{cursor:pointer;}
  [hidden]{display:none !important;}

  /* ---------- 布局 ---------- */
  #shell{display:flex;min-height:100vh;}
  nav{width:172px;flex:none;background:var(--sidebar);color:#CFD8D2;padding:22px 0;}
  nav .brand{font-size:15px;font-weight:600;color:#fff;padding:0 18px 18px;}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;
             color:#AFBDB5;padding:8px 18px;font-size:13.5px;}
  nav button:hover{color:#fff;}
  nav button.on{color:#fff;background:rgba(255,255,255,.09);
                box-shadow:inset 2px 0 0 #8FBF9E;}
  nav .badge{float:right;font-size:11px;opacity:.75;}
  nav .sep{height:1px;background:rgba(255,255,255,.1);margin:12px 18px;}
  main{flex:1;padding:34px 34px 90px;max-width:900px;}

  h2{font-size:17px;font-weight:600;margin:0 0 3px;}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:26px 0 10px;}

  /* ---------- 表单 ---------- */
  .form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
        background:var(--card);border:1px solid var(--line);border-radius:9px;
        padding:12px;margin-bottom:18px;}
  .fld{display:flex;flex-direction:column;gap:3px;}
  .fld label{font-size:11px;color:var(--muted);}
  .fld input,.fld select{padding:7px 9px;border:1px solid var(--line);
        border-radius:6px;background:#fff;min-width:120px;}
  .fld.wide{flex:1;min-width:200px;}
  .fld.wide input{width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--fresh);}

  .btn{padding:7px 14px;border:1px solid var(--ink);border-radius:6px;
       background:var(--ink);color:#fff;}
  .btn.quiet{background:#fff;color:var(--muted);border-color:var(--line);
             padding:3px 9px;font-size:12px;}
  .btn.link{background:none;border:0;color:var(--muted);font-size:12px;padding:3px 6px;}
  .btn.link:hover{color:var(--cold);}

  /* ---------- 列表 ---------- */
  .row{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;
       border-bottom:1px solid var(--line);}
  .row .main{flex:1;min-width:0;}
  .row .title{font-weight:500;}
  .row .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .row .acts{display:flex;gap:5px;align-items:center;flex:none;}
  .done .title{text-decoration:line-through;color:var(--muted);}
  /* 待办分色：左侧色条，按 tag。灰=视觉退后的中性类 */
  .row.tCourse{box-shadow:inset 3px 0 0 var(--stale);padding-left:9px;}
  .row.tCareer{box-shadow:inset 3px 0 0 var(--cold);padding-left:9px;}
  .row.tSelf{box-shadow:inset 3px 0 0 var(--purp);padding-left:9px;}
  .row.tMisc{box-shadow:inset 3px 0 0 var(--line);padding-left:9px;}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;}

  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;
        border:1px solid var(--line);color:var(--muted);}
  /* 状态语义色（填充+白字）：st1 进行中·黄 st2 完成·绿 st3 确定中间态·蓝 st4 对照组·红
     黄用比 --stale 深一档的 #8F6C22，不然白字压不住；灰（还没动）保持描边——视觉上该退后 */
  .pill.st1{background:#8F6C22;border-color:#8F6C22;color:#fff;}
  .pill.st2{background:var(--fresh);border-color:var(--fresh);color:#fff;}
  .pill.st3{background:var(--appt);border-color:var(--appt);color:#fff;}
  .pill.st4{background:var(--cold);border-color:var(--cold);color:#fff;}
  /* 分类管理条 */
  .catbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
  .catbar input{padding:5px 9px;border:1px solid var(--line);border-radius:8px;
        background:var(--card);width:110px;font-size:13px;}
  .catbar .pill a{cursor:pointer;margin-left:5px;color:var(--muted);}
  .catbar .pill a:hover{color:var(--cold);}
  /* 子任务 */
  .subs{margin-top:5px;}
  .sub-item{font-size:12.5px;padding:2px 0;cursor:pointer;display:flex;align-items:center;gap:7px;}
  .sub-item .ck{width:14px;height:14px;border:1px solid var(--line);border-radius:4px;flex:none;
        font-size:10px;line-height:13px;text-align:center;color:var(--fresh);background:var(--card);}
  .sub-item.sdone .st{color:var(--muted);text-decoration:line-through;}
  .sub-item .sx{margin-left:6px;color:var(--muted);opacity:.45;padding:0 4px;}
  .sub-item:hover .sx{opacity:1;}
  .sub-add{font-size:12px;color:var(--muted);cursor:pointer;display:inline-block;margin-top:3px;}
  .sub-in{display:block;margin-top:5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;
        font-size:12.5px;width:min(340px,100%);background:var(--card);}
  .sub-in.qt{width:100%;margin-top:9px;}
  .num{font-variant-numeric:tabular-nums;font-weight:600;min-width:58px;}
  .fresh{color:var(--fresh);} .stale{color:var(--stale);} .cold{color:var(--cold);}

  /* ---------- 打卡 ---------- */
  .lines{border-top:1px solid var(--line);}
  .lineBtn{display:flex;align-items:center;gap:15px;width:100%;text-align:left;
           padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;
           cursor:pointer;}
  .cell.canfix{cursor:pointer;}
  .lineBtn:hover{background:rgba(0,0,0,.015);}
  .lineBtn .num{font-size:27px;line-height:1;min-width:66px;}
  .lineBtn .num small{font-size:11px;font-weight:400;color:var(--muted);}
  .mark{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);
        display:grid;place-items:center;color:#fff;font-size:11px;flex:none;}
  .mark.on{background:var(--fresh);border-color:var(--fresh);}
  .cal{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;
       grid-auto-columns:11px;gap:3px;margin-bottom:22px;}
  .cell{width:11px;height:11px;border-radius:2px;background:#E7EAE6;}
  .cell.done{background:var(--fresh);}
  .cell.today{box-shadow:0 0 0 1.5px var(--ink);}
  .cell.future{background:transparent;}

  /* ---------- 日历页 ---------- */
  .calHead{display:flex;align-items:center;gap:10px;margin:2px 0 10px;}
  .calHead .legend{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--muted);}
  .legend i{font-style:normal;display:flex;align-items:center;gap:4px;}
  .legend i::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--muted);}
  .legend i.appt::before{background:var(--appt);}
  .legend i.task::before{background:var(--stale);}
  .legend i.tCareer::before{background:var(--cold);}
  .legend i.tSelf::before{background:var(--purp);}
  .legend i.tMisc::before{background:var(--muted);}
  .legend i.event::before{background:var(--fresh);}
  .calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;}
  .calCell{background:var(--card);border:1px solid var(--line);border-radius:6px;
           min-height:76px;padding:4px 5px;}
  .calCell.dim{opacity:.4;}
  .calCell.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .cd{font-size:11px;color:var(--muted);margin-bottom:2px;}
  .ci{font-size:10.5px;line-height:1.4;border-left:2.5px solid;padding-left:4px;
      margin-bottom:2px;overflow:hidden;display:-webkit-box;
      -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
  .ci.appt{border-color:var(--appt);color:var(--appt);}
  .ci.task{border-color:var(--stale);color:var(--stale);}
  .ci.tCareer{border-color:var(--cold);color:var(--cold);}
  .ci.tSelf{border-color:var(--purp);color:var(--purp);}
  .ci.tMisc{border-color:var(--muted);color:var(--muted);}
  .ci.event{border-color:var(--fresh);color:var(--fresh);}
  .ci.done{opacity:.55;text-decoration:line-through;}
  @media(max-width:720px){ .calCell{min-height:56px;} .calHead .legend{display:none;} }

  /* ---------- 首页 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;
        padding:14px 16px;margin-bottom:14px;}
  .card h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .card .row:last-child{border-bottom:0;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1px solid var(--line);border-radius:7px;background:#fff;
        padding:6px 10px;font-size:12.5px;}
  .chip b{font-variant-numeric:tabular-nums;}

  /* ---------- 登录 ---------- */
  #loginView{max-width:300px;margin:90px auto;}
  #loginView input{width:100%;margin-bottom:9px;padding:9px 11px;
        border:1px solid var(--line);border-radius:7px;}
  #loginMsg{font-size:12.5px;color:var(--cold);min-height:19px;margin-top:9px;}

  footer{position:fixed;bottom:0;left:172px;right:0;background:var(--paper);
         border-top:1px solid var(--line);padding:7px 34px;display:flex;
         gap:8px;align-items:center;font-size:12px;}
  #status{margin-left:auto;color:var(--muted);}
  #status.ok{color:var(--fresh);} #status.err{color:var(--cold);}

  @media(max-width:720px){
    #shell{flex-direction:column;}
    nav{width:100%;display:flex;flex-wrap:wrap;padding:10px;}
    nav .brand,nav .sep{display:none;}
    nav button{width:auto;padding:6px 10px;}
    main{padding:20px 16px 90px;}
    footer{left:0;padding:7px 16px;}
  }
</style>
</head>
<body>

<!-- ==================== 登录 ==================== -->
<div id="loginView">
  <h2>Life OS</h2>
  <p class="sub">换设备登一次，数据自己回来</p>
  <input id="email" type="email" placeholder="邮箱" autocomplete="username">
  <input id="password" type="password" placeholder="密码" autocomplete="current-password">
  <button class="btn" id="loginBtn">登录</button>
  <div id="loginMsg"></div>
</div>

<!-- ==================== 主体 ==================== -->
<div id="shell" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>
    <button class="btn quiet" id="syncBtn">同步</button>
    <button class="btn quiet" id="exportBtn">导出 JSON</button>
    <button class="btn quiet" id="logoutBtn">退出</button>
    <button class="btn quiet" id="langBtn">EN</button>
    <span id="status"></span>
  </footer>
</div>

function merge(l, c){
  const m = new Map(l.map(i=>[i.id,i]));
  for(const x of c){ const o=m.get(x.id); if(!o || (x.updatedAt||0)>(o.updatedAt||0)) m.set(x.id,x); }
  return [...m.values()];
}

let syncing=false, syncQueued=false;
async function sync(){
  if(!uid) return;
  if(syncing){ syncQueued=true; return; }        // 已有一个在跑：记一笔，跑完补一次
  syncing=true;
  setStatus(L("同步中…"));
  try{
    const snap = await getDocs(collection(db,"users",uid,"items"));
    const cloud = snap.docs.map(d=>d.data());
    const cm = new Map(cloud.map(c=>[c.id,c]));
    const toPush = items.filter(l=>{ const c=cm.get(l.id); return !c || (l.updatedAt||0)>(c.updatedAt||0); });
    items = merge(items, cloud);
    saveLocal(items); render();
    for(const it of toPush){                     // 串行写，不并发
      await setDoc(doc(db,"users",uid,"items",it.id), it);
    }
    setStatus(L("已同步"),"ok");
  }catch(e){ setStatus(L("同步失败：")+(e.code||e.message),"err"); console.error(e); }
  finally{
    syncing=false;
    if(syncQueued){ syncQueued=false; sync(); }   // 同步期间又有写入 → 再跑一轮兜底
  }
}

function put(o){
  const now = Date.now();
  const i = items.findIndex(x=>x.id===o.id);
  if(i>=0) items[i] = {...items[i], ...o, updatedAt:now};
  else     items.push({createdAt:now, deleted:false, ...o, updatedAt:now});
  saveLocal(items); render(); sync();
}
const del = id => put({id, deleted:true});          // 软删除，否则同步会把它复活

// 3. 日期
//    本地日期字符串当 key，不用 UTC——Perth 晚上打的卡不会跳到明天
// ============================================================
function dayKey(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const toDate = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const diffDays = (a,b) => Math.round((b-a)/86400000);
const daysUntil = k => k ? diffDays(toDate(dayKey()), toDate(k)) : null;   // 正=还剩几天
const daysSince = k => k ? diffDays(toDate(k), toDate(dayKey())) : null;   // 正=过了几天

const openTodos = () => allTodos().filter(t=>!t.done)
                          .sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")
                                    || (a.lastc||"").localeCompare(b.lastc||""));
// 上首页的规则：每条用自己的窗口（没设默认 7 天）；有 due 看倒计时，只有 lastc 看沉默
const todoAlerts = () => openTodos().filter(t=>{
                            const w = +t.remind||7;
                            if(t.due)   return daysUntil(t.due) <= w;
                            if(t.lastc) return daysSince(t.lastc) >= w;
                            return false;
                          });

const upcomingEvts = () => all("event")
                             .filter(e=>e.date && ["想去","已报名"].includes(e.status)

const lineDays = k => all("checkin").filter(c=>c.line===k).map(c=>c.day);
function lineIdle(k){ const d=lineDays(k); return d.length ? daysSince(d.sort().at(-1)) : null; }
function tone(n, warn, cold){
  if(n===null || n>=cold) return "cold";
  if(n>=warn) return "stale";
  return "fresh";
}

function formHTML(type){
  const s = SCHEMA[type];
  const e = editing && editing.type===type ? editing : null;
  const fields = s.fields.map(f=>{
    const v = e ? (e[f.k] ?? "") : (f.def ?? (f.type==="date" && (f.k==="date"||f.k==="last") ? dayKey() : ""));
    const inp = f.type==="select"
      ? `<select data-f="${f.k}">${f.options.map(o=>
          `<option value="${o}" ${String(v)===o?"selected":""}>${L(o)}</option>`).join("")}</select>`
      : f.type==="cats"
      // 下拉选自定义分类；正在编辑的条目若带着已被删掉的旧分类，临时补进选项，编辑不会静默丢值
      ? (()=>{ const cs = getCats(type);
          const opts = v && !cs.includes(v) ? [v, ...cs] : cs;
          return `<select data-f="${f.k}"><option value="">—</option>${opts.map(o=>
            `<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`; })()
      : `<input data-f="${f.k}" type="${f.type}" value="${esc(v)}">`;
    return `<div class="fld ${f.wide?"wide":""}"><label>${L(f.label)}</label>${inp}</div>`;
  }).join("");
  return `<div class="form" id="form">
            ${fields}

            ${e?`<button class="btn quiet" id="cancelBtn">${L("取消")}</button>`:""}
          </div>`;
}

function bindForm(type){

function todoRow(t, acts=""){
  const ball = t.ball&&t.ball!=="无" ? ` · ${FMT.ball(esc(L(t.ball)))}` : "";
  const tag  = tagOf(t);
  const w = +t.remind||7;
  let num="—", cls="";
  if(t.due){
    const d = daysUntil(t.due);
    cls = t.done ? "" : d<0||d<=1 ? "cold" : d<=w ? "stale" : "fresh";
    num = d<0 ? FMT.overdue(-d) : d===0 ? L("今天") : FMT.nDays(d);
  }else if(t.lastc){
    const n = daysSince(t.lastc);
    cls = t.done ? "" : n>=w*2 ? "cold" : n>=w ? "stale" : "fresh";
    num = FMT.silent(n);
  }
  const subs = t.subs&&t.subs.length ? `<div class="subs">${t.subs.map((s,i)=>
      `<div class="sub-item ${s.done?"sdone":""}" data-subtoggle="${t.id}|${i}">
        <span class="ck">${s.done?"✓":""}</span><span class="st">${esc(s.t)}</span>
        <a class="sx" data-subdel="${t.id}|${i}">×</a></div>`).join("")}</div>` : "";
  const addUi = t.done ? "" : subAdding===t.id
      ? `<input class="sub-in" id="subText" placeholder="${L("回车保存")}">`
      : `<a class="sub-add" data-subopen="${t.id}">＋ ${L("子任务")}</a>`;
  return `<div class="row ${t.done?"done":""} ${tagCls(t)}">
    <span class="num ${cls}">${num}</span>
    <div class="main"><div class="title">${esc(t.title)}</div>
      <div class="meta"><span class="pill">${esc(L(tag))}</span> ${esc(t.due||"")}${
        !t.due&&t.lastc?`${L("上次往来")} ${esc(t.lastc)}`:""}${ball}</div>${subs}${addUi}</div>
    ${acts?`<div class="acts">${acts}</div>`:""}
  </div>`;
}

function viewCheckin(){
  const today = dayKey();
  const yd = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); })();
  const rows = LINES.map(c=>{
    const days = lineDays(c.key);
    const n = lineIdle(c.key), done = days.includes(today);
    const num = n===null ? L("从未") : n===0 ? L("今天") : n;
    const unit = (n===null||n===0) ? "" : `<small>${L("天前")}</small>`;
    return `<div class="lineBtn" data-line="${c.key}">
      <span class="num ${tone(n,c.warn,c.cold)}">${num}${unit}</span>
      <span class="main"><span class="title">${L(c.name)}</span>
        <div class="meta">${L(c.rule)}</div></span>
      ${days.includes(yd)?"":`<button class="btn link" data-fill="${c.key}">${L("补昨天")}</button>`}
      <span class="mark ${done?"on":""}">${done?"✓":""}</span></div>`;
  }).join("");

  const today0 = toDate(dayKey());
  const start = new Date(today0);
  start.setDate(start.getDate()-69);
  start.setDate(start.getDate()-((start.getDay()+6)%7));      // 回退到那周周一

  const cals = LINES.filter(c=>c.cal).map(c=>{
    const done = new Set(lineDays(c.key));
    let cells="", hit=0;
    for(let i=0;i<77;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=dayKey(d);
      let cls = d>today0 ? "future" : (done.has(k) ? (hit++, "done") : "");
      const back = diffDays(d, today0);                 // 近 7 天可点击补卡/取消
      const fix = back>=0 && back<=7 ? ` canfix" data-cal="${c.key}" data-day="${k}` : "";
      cells += `<div class="cell ${cls}${k===dayKey()?" today":""}${fix}" title="${k}"></div>`;
    }
    return `<h3>${FMT.tenWeeks(L(c.name),hit)}</h3><div class="cal">${cells}</div>`;
  }).join("");

  return `<h2>${L("打卡")}</h2><p class="sub">${L("点整行 = 今天碰过了，再点取消 · 漏打的用行尾「补昨天」，康复日历近 7 天格子也能直接点")}</p>
          <div class="lines">${rows}</div>${cals}`;
}

                   // doneDay 优先：完成后再改标题不会被顶到最上面；旧数据退回 updatedAt
                   const k = t => t.doneDay ? new Date(t.doneDay+"T12:00").getTime() : (t.updatedAt||0);
                   return k(a)-k(b);
                 }).slice(-15).reverse();
  const acts = t => `<button class="btn quiet" data-done="${t.id}">${t.done?L("撤销"):L("完成")}</button>
        ${editBtn(t.id)}${delBtn(t.id)}`;
  return `<h2>${L(SCHEMA.task.title)}</h2><p class="sub">${L(SCHEMA.task.sub)}</p>
    ${formHTML("task")}
    ${list(open, t=>todoRow(t, acts(t)), L("没有待办。"))}
    ${done.length?`<h3>${L("最近完成")}</h3>${done.map(t=>todoRow(t, acts(t))).join("")}`:""}`;
}

let calYM = null;                                   // 当前显示的年月，翻页会改

function viewCal(){
  if(!calYM){ const n=new Date(); calYM={y:n.getFullYear(), m:n.getMonth()}; }
  const {y,m} = calYM;

  // —— 四张表的日期铺到 day → 条目 的 map ——
  const byDay = {};
  const push = (day,label,cls) => { (byDay[day] ||= []).push({label,cls}); };
  all("appt").forEach(a=> a.date && push(a.date,
      (a.tag&&a.tag!=="其他" ? L(a.tag)+"·" : "")+a.title, "appt"));
  allTodos().forEach(t=>{
    // 已完成落实际完成日（doneDay）；旧数据没有 doneDay 就留在 due 格，不拿 updatedAt 猜
    const day = t.done ? (t.doneDay || t.due) : t.due;
    if(day) push(day, t.title, "task "+tagCls(t)+(t.done?" done":""));
    // 完成的子任务各落各的完成日，色条继承父任务 tag
    (t.subs||[]).forEach(s=>{ if(s.done && s.doneDay) push(s.doneDay, s.t, "task "+tagCls(t)+" done"); });
  });
  all("event").forEach(e=> e.date && push(e.date, e.title,
      "event"+(e.status==="没去"?" done":"")));      // 「没去」划掉但保留——对照组

  const first = new Date(y,m,1);
  const start = new Date(first);
  start.setDate(1-((first.getDay()+6)%7));          // 回退到周一
  const todayK = dayKey();
  let cells = "";
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = dayKey(d), inM = d.getMonth()===m;
    const es = byDay[k]||[];
    const items = es.map(it=>
        `<div class="ci ${it.cls}" title="${esc(it.label)}">${esc(it.label)}</div>`).join("");
    cells += `<div class="calCell ${inM?"":"dim"}${k===todayK?" now":""}">
                <div class="cd">${d.getDate()}</div>${items}</div>`;
  }
  const wd = (lang==="en"?["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]:["一","二","三","四","五","六","日"])
    .map(w=>`<div class="wd">${w}</div>`).join("");

  // 排期中的预约列表（编辑/删除入口在这，格子太小放不下按钮）
  const up = all("appt").filter(a=>a.date && daysUntil(a.date)>=0)
               .sort((a,b)=>a.date.localeCompare(b.date));
  const upRows = list(up, a=>`<div class="row">
      <span class="num ${daysUntil(a.date)<=1?"stale":"fresh"}">${
        daysUntil(a.date)===0?L("今天"):daysUntil(a.date)===1?L("明天"):FMT.daysLater(daysUntil(a.date))}</span>
      <div class="main"><div class="title">${esc(a.title)}</div>
        <div class="meta"><span class="pill">${esc(L(a.tag||"其他"))}</span> ${esc(a.date)}${
          a.note?" · "+esc(a.note):""}</div></div>
      <div class="acts">${editBtn(a.id)}${delBtn(a.id)}</div></div>`,
    L("没有排期中的预约。"));

  return `<h2>${L("日历")}</h2><p class="sub">${L(SCHEMA.appt.sub)}${L("——预约在这录，其它表的日期自动铺上来")}</p>
    ${formHTML("appt")}
    <div class="calHead">
      <button class="btn quiet" id="calPrev">‹</button>
      <b>${FMT.monthTitle(y,m)}</b>
      <button class="btn quiet" id="calNext">›</button>
      <span class="legend"><i class="appt">${L("预约")}</i><i class="task">${L("课程")}</i><i class="tCareer">${L("申请")}</i><i class="tSelf">${L("自驱")}</i><i class="tMisc">${L("其他待办")}</i><i class="event">${L("活动")}</i></span>
    </div>
    <div class="calGrid">${wd}${cells}</div>
    <h3>${L("排期中的预约")}</h3>${upRows}`;
}

const NAV = [
  ["home","今天"], ["task",SCHEMA.task.nav], ["cal","日历"], ["checkin","打卡"], ["-"], ["xhs",SCHEMA.xhs.nav], ["media",SCHEMA.media.nav], ["trade",SCHEMA.trade.nav],
  ["event",SCHEMA.event.nav], ["person",SCHEMA.person.nav], ["-"],
  ["inbox","Inbox"], ["review",SCHEMA.review.nav],
];

function renderNav(){
  const badges = {
    home: todoAlerts().length,
    task: openTodos().length,
    inbox: inboxOpen().length,
    person: peopleDue().length,
    review: reviewDue().length,
  };
  $("nav").innerHTML = `<div class="brand">Life OS</div>` + NAV.map(([k,label])=>
    k==="-" ? `<div class="sep"></div>`
    : `<button data-v="${k}" class="${view===k?"on":""}">${L(label)}
         ${badges[k] ? `<span class="badge">${badges[k]}</span>` : ""}</button>`).join("");
  $("nav").querySelectorAll("[data-v]").forEach(b=>
    b.onclick = () => { view=b.dataset.v; editing=null; location.hash=view; render(); });
}

const VIEWS = { home:viewHome, task:viewTodo, cal:viewCal, checkin:viewCheckin,
                xhs:viewXhs, media:viewMedia, trade:viewTrade, event:viewEvent, person:viewPerson,
                inbox:viewInbox, review:viewReview };

// hash 路由：index.html#inbox 直接落 Inbox——手机主屏图标用这个链接
const hashView = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : null; };
view = hashView() || view;
window.addEventListener("hashchange", ()=>{
  const v = hashView();
  if(v && v!==view){ view=v; editing=null; render(); }
});

let lastView = null;
function render(){
  if(!uid) return;
  // 手机上打字打到一半时后台 sync 完成会触发 render，innerHTML 重建等于清空输入框。
  // 所以渲染前把草稿和焦点存下来，渲染后还回去。
  const nt0 = $("noteText");
  const draft = nt0 ? nt0.value : "";
  const hadFocus = nt0 && document.activeElement === nt0;
  const st0 = $("subText");
  const subDraft = st0 ? st0.value : "";
  const subFocus = st0 && document.activeElement === st0;
  const qt0 = $("qtText");
  const qtDraft = qt0 ? qt0.value : "";
  const qtFocus = qt0 && document.activeElement === qt0;
  const entering = view !== lastView; lastView = view;
  renderNav();
  $("main").innerHTML = VIEWS[view]();

  if(SCHEMA[view]) bindForm(view);
  if(view==="cal"){                     // 日历页：表单存的是 appt，SCHEMA 里没有 "cal" 这个 key
    bindForm("appt");
    $("calPrev").onclick = () => { calYM.m--; if(calYM.m<0){ calYM.m=11; calYM.y--; } render(); };
    $("calNext").onclick = () => { calYM.m++; if(calYM.m>11){ calYM.m=0; calYM.y++; } render(); };
  }
  bindRows();

  // 打卡：点整行切换今天
  document.querySelectorAll("[data-line]").forEach(b=> b.onclick=()=>{
    const day=dayKey(), id=`checkin_${b.dataset.line}_${day}`;
    const cur=items.find(i=>i.id===id);
    // id 固定 → 同一天重复点不会多出一条，多设备也落在同一个 id
    put({id, type:"checkin", line:b.dataset.line, day, deleted: cur ? !cur.deleted : false});
  });
  // 补昨天（stopPropagation：这个按钮在整行点击区里面，不拦会连带打今天的卡）
  document.querySelectorAll("[data-fill]").forEach(b=> b.onclick=e=>{
    e.stopPropagation();
    const d=new Date(); d.setDate(d.getDate()-1); const day=dayKey(d);
    put({id:`checkin_${b.dataset.fill}_${day}`, type:"checkin", line:b.dataset.fill, day, deleted:false});
  });
  // 日历格子补卡 / 取消（近 7 天）
  document.querySelectorAll("[data-cal]").forEach(el=> el.onclick=()=>{
    const line=el.dataset.cal, day=el.dataset.day, id=`checkin_${line}_${day}`;
    const cur=items.find(i=>i.id===id);
    put({id, type:"checkin", line, day, deleted: cur ? !cur.deleted : false});
  });
  // 任务完成 / 撤销
  document.querySelectorAll("[data-done]").forEach(b=> b.onclick=()=>{
    const t=items.find(i=>i.id===b.dataset.done);
    put({id:t.id, done:!t.done, doneDay: !t.done ? dayKey() : null});
  });
  // 「今天联系了」/「已 review」
  document.querySelectorAll("[data-touch]").forEach(b=> b.onclick=()=>
    put({id:b.dataset.touch, last:dayKey()}));
  // 首页临时任务：Enter 即建 due=今天的杂事任务，进窗口卡 + 今天日历格；完成后走 doneDay
  if($("qtText")){
    const q = $("qtText");
    q.onkeydown = e => {
      if(e.key!=="Enter") return;
      const v = q.value.trim(); if(!v) return;
      q.value = "";
      put({id:crypto.randomUUID(), type:"task", title:v, tag:"杂事", due:dayKey(), remind:7});
      if($("qtText")) $("qtText").focus();
    };
  }
  if(qtDraft && $("qtText")) $("qtText").value = qtDraft;
  if(qtFocus && $("qtText")) $("qtText").focus();
  // 子任务：整行点 = 勾选，× = 删除，＋ = 展开输入框（Enter 存并连续录入，Esc 收起）
  const subRef = v => { const p=v.lastIndexOf("|"); return [v.slice(0,p), +v.slice(p+1)]; };
  document.querySelectorAll("[data-subtoggle]").forEach(el=> el.onclick=()=>{
    const [id,i] = subRef(el.dataset.subtoggle), x = items.find(o=>o.id===id);
    put({id, subs: x.subs.map((s,k)=> k===i
      ? {...s, done:!s.done, doneDay: !s.done ? dayKey() : null} : s)});
  });
  document.querySelectorAll("[data-subdel]").forEach(el=> el.onclick=e=>{
    e.stopPropagation();
    const [id,i] = subRef(el.dataset.subdel), x = items.find(o=>o.id===id);
    put({id, subs: x.subs.filter((_,k)=>k!==i)});
  });
  document.querySelectorAll("[data-subopen]").forEach(el=> el.onclick=()=>{
    subAdding = el.dataset.subopen; render();
    if($("subText")) $("subText").focus();
  });
  if($("subText")){
    const inp = $("subText");
    inp.onkeydown = e => {
      if(e.key==="Enter"){
        const v = inp.value.trim(); if(!v) return;
        const x = items.find(o=>o.id===subAdding);
        inp.value = "";                                   // 先清再存，同 Inbox
        put({id:subAdding, subs:[...(x.subs||[]), {t:v, done:false}]});
        if($("subText")) $("subText").focus();            // put→render 重建后接着打下一条
      }
      if(e.key==="Escape"){ subAdding = null; render(); }
    };
    inp.onblur = () => {                                  // 点别处且没打字 → 收起
      if(!document.contains(inp)) return;
      if(!inp.value.trim()){ subAdding = null; render(); }
    };
  }
  if(subDraft && $("subText")) $("subText").value = subDraft;   // 还原被后台 sync 打断的草稿
  if(subFocus && $("subText")) $("subText").focus();
  // Inbox 消化 / 还原 / 已消化列表开合
  document.querySelectorAll("[data-undigest]").forEach(b=> b.onclick=()=>
    put({id:b.dataset.undigest, digested:false, digestedAt:null}));
  if($("digToggle")) $("digToggle").onclick = ()=>{ showDigested=!showDigested; render(); };
  // 选题库分类管理（put 自带 render，加删完列表立即刷新）
  if($("addCat")) $("addCat").onclick = ()=>{
    const v = $("newCat").value.trim();
    if(!v) return;
    const cs = getCats("xhs");
    if(cs.includes(v)) { $("newCat").value=""; return; }
    put({id:catsId("xhs"), type:"cfg", list:[...cs, v]});
  };
  document.querySelectorAll("[data-delcat]").forEach(a=> a.onclick=()=>
    put({id:catsId("xhs"), type:"cfg", list:getCats("xhs").filter(c=>c!==a.dataset.delcat)}));
  document.querySelectorAll("[data-digest]").forEach(b=> b.onclick=()=>
    put({id:b.dataset.digest, digested:true, digestedAt:Date.now()}));

  if($("noteAdd")){
    const add = () => {
      const t=$("noteText").value.trim(); if(!t) return;
      $("noteText").value="";              // 先清再存：put 会触发 render，草稿恢复不能捞回已存的字
      put({id:crypto.randomUUID(), type:"note", text:t, digested:false});
    };
    $("noteAdd").onclick = add;
    $("noteText").onkeydown = e => { if(e.key==="Enter") add(); };
    if(draft) $("noteText").value = draft;              // 还原被重渲染打断的草稿
    if(entering || hadFocus) $("noteText").focus();     // 进页/原本在打字 → 键盘直接弹出来
  }
}

$("logoutBtn").onclick = () => signOut(auth);
$("syncBtn").onclick = sync;
$("exportBtn").onclick = () => {
  const b = new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `lifeos-${dayKey()}.json`;
  a.click();
};

// —— 语言切换：只翻显示层；chrome（footer/登录页）是静态 HTML，单独刷 ——
function applyChrome(){
  $("langBtn").textContent = lang==="en" ? "中文" : "EN";
  $("syncBtn").textContent = L("同步");
  $("exportBtn").textContent = L("导出 JSON");
  $("logoutBtn").textContent = L("退出");
  $("loginBtn").textContent = L("登录");
  $("email").placeholder = L("邮箱");
  $("password").placeholder = L("密码");
  document.querySelector("#loginView .sub").textContent = L("换设备登一次，数据自己回来");
  document.documentElement.lang = lang==="en" ? "en" : "zh-CN";
}
$("langBtn").onclick = () => {
  lang = lang==="en" ? "zh" : "en";
  localStorage.setItem("lifeos_lang", lang);
  applyChrome();
  if(uid) render();
};
applyChrome();

onAuthStateChanged(auth, async user => {
  if(user){
    uid = user.uid;
    $("loginView").hidden = true; $("shell").hidden = false;
    items = loadLocal(); render();     // 本地先渲染，秒开
    await sync();                      // 云端到了再刷
  }else{
    uid=null; items=[];
    $("loginView").hidden=false; $("shell").hidden=true;
    $("loginMsg").textContent="";
  }
});
</script>
</body>
</html>
